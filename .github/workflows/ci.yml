name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    # The watchdog is a Windows scheduled task and its launcher is a VBScript, so the suite
    # is Windows-only: `cscript.exe` has to be there for the launcher tests to mean anything.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run the test suite
        run: node --test

      # 下面三步是「发布漂移 / 打包 / 风格」守卫，全部零第三方依赖，只用 Node 标准库。
      # 任何一步非零退出都会把 CI 标红——这是有意的：这些正是测试盖不到的缺口。
      - name: Check the published copy for drift
        # runner 上没有安装插件，这里会打印 SKIPPED 并以 0 退出，不会把 CI 变红。
        run: node scripts/check-published.mjs

      - name: Check the package for dependencies and path leaks
        run: node scripts/check-package.mjs

      - name: Check the shipped source for style violations
        run: node scripts/check-style.mjs
