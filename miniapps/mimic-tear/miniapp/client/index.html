<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>仿身泪滴</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header__brand">
        <svg
          class="icon"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 3c3.2 3.1 5 6 5 8.8A5 5 0 0 1 7 11.8C7 9 8.8 6.1 12 3Z" />
          <path d="M9.5 13.5c0 2 1.1 3.3 2.5 4.5 1.4-1.2 2.5-2.5 2.5-4.5" />
        </svg>
        <div>
          <h1>仿身泪滴</h1>
          <p class="app-header__subtitle">多智能体项目管理指挥部</p>
        </div>
      </div>

      <nav class="app-nav" aria-label="主导航">
        <a href="#/overview" data-nav="overview" aria-current="page">总览</a>
        <a href="#/inbox" data-nav="inbox">
          决策收件箱
          <span class="badge" id="inbox-badge" hidden>0</span>
        </a>
        <a href="#/skills" data-nav="skills">能力库</a>
      </nav>

      <div class="app-header__actions">
        <span class="app-status" id="app-status" role="status">正在连接…</span>
        <label class="app-toggle">
          <input type="checkbox" id="patrol-enabled" />
          <span>大哥巡检</span>
        </label>
        <label class="app-toggle" title="允许大哥在巡检时直接派工，而不是只汇报">
          <input type="checkbox" id="patrol-autodispatch" />
          <span>允许自动派工</span>
        </label>
        <button type="button" class="btn btn--small" id="patrol-run-button" aria-label="立即巡检一次">巡检</button>
        <button type="button" class="btn btn--small" id="refresh-button" aria-label="刷新数据">刷新</button>
      </div>
    </header>

    <div class="app-warning" id="data-warning" role="alert" hidden></div>

    <main id="app-main">
      <!-- ================= 总览 ================= -->
      <section id="view-overview" class="view" aria-labelledby="overview-title">
        <div class="section">
          <h2 id="overview-title">总览</h2>
          <div class="kpi-row" id="kpi-row">
            <div class="kpi">
              <p class="kpi__label">项目总数</p>
              <p class="kpi__value" id="kpi-projects">—</p>
            </div>
            <div class="kpi">
              <p class="kpi__label">正在推进</p>
              <p class="kpi__value" id="kpi-active">—</p>
            </div>
            <div class="kpi kpi--warning">
              <p class="kpi__label">待你决策</p>
              <p class="kpi__value" id="kpi-pending">—</p>
            </div>
            <div class="kpi kpi--danger">
              <p class="kpi__label">异常项目</p>
              <p class="kpi__value" id="kpi-errors">—</p>
            </div>
          </div>
        </div>

        <section class="section" aria-labelledby="attention-title">
          <div class="section__head">
            <h2 id="attention-title">需你处理</h2>
            <span class="count" id="attention-count"></span>
          </div>
          <div class="panel">
            <div class="panel__body panel__body--flush">
              <div class="item-list" id="attention-list"></div>
            </div>
          </div>
        </section>

        <section class="section" aria-labelledby="projects-title">
          <div class="section__head">
            <h2 id="projects-title">项目</h2>
            <span class="count" id="projects-count"></span>
          </div>
          <div class="panel">
            <div class="panel__body panel__body--flush">
              <div class="table-scroll">
                <table>
                  <caption class="visually-hidden">全部项目的当前状态</caption>
                  <thead>
                    <tr>
                      <th scope="col">项目</th>
                      <th scope="col">状态</th>
                      <th scope="col">Goal</th>
                      <th scope="col" class="numeric">会话</th>
                      <th scope="col" class="numeric">待决策</th>
                      <th scope="col">最后活动</th>
                      <th scope="col"><span class="visually-hidden">操作</span></th>
                    </tr>
                  </thead>
                  <tbody id="projects-body"></tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </section>

      <!-- ================= 决策收件箱 ================= -->
      <section id="view-inbox" class="view" aria-labelledby="inbox-title" hidden>
        <div class="section">
          <div class="section__head">
            <h2 id="inbox-title">决策收件箱</h2>
            <span class="count" id="inbox-count"></span>
          </div>
          <div class="section__actions">
            <label class="field" for="inbox-filter">
              <span class="visually-hidden">按项目过滤</span>
            </label>
            <select class="btn btn--small" id="inbox-filter" aria-label="按项目过滤">
              <option value="">全部项目</option>
            </select>
            <label class="visually-hidden" for="inbox-pending-only">只看未确认</label>
            <input type="checkbox" id="inbox-pending-only" checked />
            <span>只看未确认</span>
          </div>
          <div class="panel">
            <div class="panel__body panel__body--flush">
              <div class="item-list" id="inbox-list"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ================= 项目详情 ================= -->
      <section id="view-project" class="view" aria-labelledby="project-title" hidden>
        <div class="section">
          <div class="section__head">
            <h2 id="project-title">项目详情</h2>
            <span class="count mono" id="project-path"></span>
          </div>
          <div class="section__actions">
            <button type="button" class="btn btn--small" id="project-dispatch-button">
              下达指令
            </button>
            <button type="button" class="btn btn--small" id="project-back-button">返回总览</button>
          </div>
        </div>

        <div class="kpi-row" id="project-kpi"></div>

        <section class="section" aria-labelledby="org-title">
          <div class="section__head">
            <h2 id="org-title">团队结构</h2>
            <span class="count" id="org-count"></span>
          </div>
          <div class="panel">
            <div class="panel__body">
              <ul class="tree" id="org-tree"></ul>
            </div>
          </div>
        </section>

        <section class="section" aria-labelledby="goal-title">
          <div class="section__head">
            <h2 id="goal-title">Goal</h2>
            <span class="count" id="goal-count"></span>
          </div>
          <div class="panel">
            <div class="panel__body panel__body--flush">
              <div class="item-list" id="goal-list"></div>
            </div>
          </div>
        </section>

        <section class="section" aria-labelledby="plan-title">
          <div class="section__head">
            <h2 id="plan-title">计划任务</h2>
            <span class="count" id="plan-count"></span>
          </div>
          <div class="panel">
            <div class="panel__body panel__body--flush">
              <div class="item-list" id="plan-list"></div>
            </div>
          </div>
        </section>

        <section class="section" aria-labelledby="question-title">
          <div class="section__head">
            <h2 id="question-title">待答问题</h2>
            <span class="count" id="question-count"></span>
          </div>
          <div class="panel">
            <div class="panel__body panel__body--flush">
              <div class="item-list" id="question-list"></div>
            </div>
          </div>
        </section>
      </section>

      <!-- ================= 能力库 ================= -->
      <section id="view-skills" class="view" aria-labelledby="skills-title" hidden>
        <div class="section">
          <div class="section__head">
            <h2 id="skills-title">能力库</h2>
            <span class="count" id="skills-count"></span>
          </div>
          <p class="item__body">
            这些是「大哥」调度任务时依据的领域知识，不是给你执行的清单。
          </p>
          <div class="skills-layout">
            <nav class="domain-nav" id="domain-nav" aria-label="能力领域"></nav>
            <div class="panel">
              <div class="panel__body panel__body--flush">
                <div id="skill-list"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- ================= 派工面板 ================= -->
    <div class="app-warning" id="dispatch-error" role="alert" hidden></div>

    <dialog id="dispatch-dialog" aria-labelledby="dispatch-dialog-title">
      <form method="dialog" class="panel" id="dispatch-form">
        <div class="panel__head">
          <h2 id="dispatch-dialog-title">下达指令</h2>
        </div>
        <div class="panel__body" style="display: flex; flex-direction: column; gap: 12px">
          <p class="item__body" id="dispatch-target"></p>
          <div class="field">
            <label class="field__label" for="dispatch-instruction">指令内容</label>
            <textarea
              id="dispatch-instruction"
              name="instruction"
              required
              placeholder="例如：把 v1.4 的 PID 持久化任务排到明天，并汇报阻塞项"
            ></textarea>
          </div>
          <div class="field">
            <label class="field__label" for="dispatch-session">目标会话</label>
            <select id="dispatch-session" name="sessionId">
              <option value="">由大哥自行选择</option>
            </select>
          </div>
          <div class="item__actions">
            <button type="button" class="btn" id="dispatch-cancel">取消</button>
            <button type="submit" class="btn btn--primary" id="dispatch-submit">下达</button>
          </div>
        </div>
      </form>
    </dialog>

    <div class="toast-host" id="toast-host" role="status" aria-live="polite"></div>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
